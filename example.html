<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="content-type" content="text/html; charset=UTF-8">
  <title> Example use of Atomics.waitAsync </title>
</head>
<body>

<pre>
<div id=scrool>
</div>
</pre>

<script src="polyfill.js"></script>

<script>
  var sab = new SharedArrayBuffer(4096);
  var ia = new Int32Array(sab);
  ia[37] = 0x1337;
  test1();
  
  function test1() {
    var result = Atomics.waitAsync(ia, 37, 0x1337, 1000);
    if (result.async) {
      result.value.then(function (r) { log("Resolved: " + r); test2(); });
    } else {
      log("Resolved: " + result.value);
      test2();
    }
  }

  var code = `
  var ia = null;
  onmessage = function (ev) {
    if (!ia) {
      postMessage("Aux worker is running");
      ia = new Int32Array(ev.data);
    }
    postMessage("Aux worker is sleeping for a little bit");
    setTimeout(function () { postMessage("Aux worker is waking"); Atomics.notify(ia, 37); }, 1000);
  }`;

  function test2() {
    var w = new Worker("data:application/javascript," + encodeURIComponent(code));
    w.onmessage = function (ev) { log(ev.data) };
    w.postMessage(sab);
    var result = Atomics.waitAsync(ia, 37, 0x1337);
    if (result.async) {
      result.value.then(function (r) { log("Resolved: " + r); test3(w); });
    } else {
      log("Resolved: " + result.value);
      test3(w);
    }
  }

  function test3(w) {
    w.postMessage(false);
    var result1 = Atomics.waitAsync(ia, 37, 0x1337);
    if (result1.async) {
      result1.value.then(function (r) { log("Resolved 1: " + r); });
    } else {
      log("Resolved 1: " + result1.value);
    }
    var result2 = Atomics.waitAsync(ia, 37, 0x1337);
    if (result2.async) {
      result2.value.then(function (r) { log("Resolved 2: " + r); });
    } else {
      log("Resolved 2: " + result2.value);
    }
    var result3 = Atomics.waitAsync(ia, 37, 0x1337);
    if (result3.async) {
      result3.value.then(function (r) { log("Resolved 3: " + r); });
    } else {
      log("Resolved 3: " + result3.value);
    }
    
  }

  function log(msg) {
    document.getElementById("scrool").innerHTML += String(msg) + "\n";
  }
</script>
</body>
</html>
